services:
  - type: web
    name: orbit-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: DEFAULT_COMMISSION_PERCENT
        value: "15"
      - key: PAYMENT_PROVIDER
        value: mock
      # Set this once the frontend is deployed, to its real URL (e.g.
      # https://orbit.vercel.app) - locks CORS down instead of leaving it open.
      - key: FRONTEND_URL
        sync: false

databases:
  - name: orbit-db
    plan: free
